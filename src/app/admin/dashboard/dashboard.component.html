<div
  *ngIf="openSecondsuccess"
  class="modal-container-success fixed top-4 right-4 z-50 max-w-sm"
  [@slideIn]
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title"
>
  <div class="bg-green-50 border border-green-200 rounded-lg shadow-lg">
    <div class="p-4 flex items-center space-x-3">
      <span class="text-green-600 text-xl"
        ><i class="fa-solid fa-check"></i
      ></span>
      <p class="text-green-800 font-semibold text-lg">Login successful!</p>
    </div>
  </div>
</div>

<div class="container mx-auto px-2 lg:px-4 pt-2 pb-8">
  <!-- Welcome Header -->
  <div
    class="welcome-header rounded-xl shadow-lg p-8 mb-8 text-center text-white"
  >
    <h1 class="text-4xl font-bold mb-2">Welcome Back, {{ name }}!</h1>
    <p class="w-[70%] mx-auto text-lg opacity-90">
      Chandra Cargo Pvt. Ltd., is the best transportation service provider in
      Jaipur and all over India. Road transport is a flexible mode of freight
      service.
    </p>
  </div>
</div>
